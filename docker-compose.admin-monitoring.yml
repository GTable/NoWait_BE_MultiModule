services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-admin
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-admin.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - nowait-app-admin-api
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-admin
    ports:
      - "3004:3000"
    volumes:
      - grafana-admin-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  grafana-admin-data:
